spring.application.name=gimnasio-api
spring.config.import=optional:file:.env[.properties]

# --- Seguridad (JWT) ---
# El secreto sale del archivo .env (ver .env.example). Minimo 32 caracteres.
jwt.secret=${JWT_SECRET}


spring.datasource.url=jdbc:mysql://localhost:3306/gimnasio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:mysql123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html

server.port=8080
