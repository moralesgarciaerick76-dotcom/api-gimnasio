spring.application.name=gimnasio-api

# --- MySQL ---
# La base de datos gimnasio_db se crea sola (createDatabaseIfNotExist=true).
# Usuario y clave salen de las variables de entorno DB_USER y DB_PASSWORD.
# Si no existen, se usa el valor que esta despues de los dos puntos (root / root).
# Asi la clave real no se sube a GitHub: basta con definir las variables o cambiar el valor por defecto.
spring.datasource.url=jdbc:mysql://localhost:3306/gimnasio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:mysql123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html

server.port=8080
